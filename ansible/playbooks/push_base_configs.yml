- name: Push VLAN database to all switches
  hosts: switches
  gather_facts: false

  vars:
    vlans:
      - { id: 10, name: Corporate-POS }
      - { id: 20, name: Guest }
      - { id: 30, name: IoT-Camera }
      - { id: 99, name: Management }
    trunk_ports:
      L3SW: ["Ethernet0/0", "Ethernet0/1", "Ethernet0/3"]
      ACC1: ["Ethernet0/1"]
      ACC2: ["Ethernet0/3"]

  tasks:
    - name: Create VLANs
      cisco.ios.ios_vlans:
        config:
          - vlan_id: "{{ item.id }}"
            name: "{{ item.name }}"
            state: active
        state: merged
      loop: "{{ vlans }}"

    - name: Configure inter-switch trunk interfaces
      cisco.ios.ios_l2_interfaces:
        config:
          - name: "{{ item }}"
            trunk:
              encapsulation: dot1q
              allowed_vlans: "10,20,30,99"
            mode: trunk
        state: merged
      loop: "{{ trunk_ports[inventory_hostname] | default([]) }}"

    - name: Set STP root primary on L3SW
      cisco.ios.ios_config:
        lines:
          - spanning-tree vlan 1,10,20,30,99 root primary
      when: inventory_hostname == "L3SW"

- name: Push subinterfaces and ACLs to R1
  hosts: routers
  gather_facts: false

  tasks:
    - name: Configure router-on-a-stick subinterfaces
      cisco.ios.ios_config:
        lines:
          - "encapsulation dot1Q {{ item.vlan }}"
          - "ip address {{ item.ip }} 255.255.255.0"
          - "no shutdown"
        parents: "interface Ethernet0/0.{{ item.vlan }}"
      loop:
        - { vlan: 10, ip: "10.10.10.1" }
        - { vlan: 20, ip: "10.10.20.1" }
        - { vlan: 30, ip: "10.10.30.1" }
        - { vlan: 99, ip: "10.10.99.1" }

    - name: Push GUEST-OUT ACL
      cisco.ios.ios_config:
        lines:
          - "ip access-list extended GUEST-OUT"
          - " deny   ip 10.10.20.0 0.0.0.255 10.10.10.0 0.0.0.255"
          - " deny   ip 10.10.20.0 0.0.0.255 10.10.30.0 0.0.0.255"
          - " deny   ip 10.10.20.0 0.0.0.255 10.10.99.0 0.0.0.255"
          - " permit ip any any"

    - name: Push IOT-OUT ACL
      cisco.ios.ios_config:
        lines:
          - "ip access-list extended IOT-OUT"
          - " deny   ip 10.10.30.0 0.0.0.255 10.10.10.0 0.0.0.255"
          - " deny   ip 10.10.30.0 0.0.0.255 10.10.99.0 0.0.0.255"
          - " permit ip any any"

    - name: Apply ACLs inbound on Guest and IoT subinterfaces
      cisco.ios.ios_config:
        lines:
          - "ip access-group {{ item.acl }} in"
        parents: "interface Ethernet0/0.{{ item.vlan }}"
      loop:
        - { vlan: 20, acl: GUEST-OUT }
        - { vlan: 30, acl: IOT-OUT }
